  --accent:#c8102e; --amber:#9a6500; --amber-bg:#fff3d1; --ok:#13804a; --track:#14181d;
  --f1:#c8102e; --f2:#1d5fd1; --f3:#7b4ce0; --f4:#12894a; --frec:#c25f00; --aca:#c42c8c; --oth:#56606b;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1216; --surface:#171b21; --sunk:#1d2229; --ink:#e8ebee; --muted:#9aa3ad; --line:#2b323b;
  --accent:#ff4b5c; --amber:#f2b705; --amber-bg:#2e2610; --ok:#3ccf7f; --track:#e8ebee;
  --f1:#ff4b5c; --f2:#5b93ff; --f3:#a98bff; --f4:#3ccf7f; --frec:#ff9a3c; --aca:#ff6bc6; --oth:#9aa3ad; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1216; --surface:#171b21; --sunk:#1d2229; --ink:#e8ebee; --muted:#9aa3ad; --line:#2b323b;
  --accent:#ff4b5c; --amber:#f2b705; --amber-bg:#2e2610; --ok:#3ccf7f; --track:#e8ebee;
  --f1:#ff4b5c; --f2:#5b93ff; --f3:#a98bff; --f4:#3ccf7f; --frec:#ff9a3c; --aca:#ff6bc6; --oth:#9aa3ad; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding-block:10px 6px;flex-wrap:wrap}
.brand{font:800 26px/1 var(--display);letter-spacing:.01em;text-transform:uppercase;font-style:italic;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:22px;height:14px;background:repeating-linear-gradient(90deg,var(--accent) 0 5.5px,var(--surface) 5.5px 11px);border:1px solid var(--accent);transform:skewX(-14deg)}
.stamp{margin-left:auto;font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
@media (max-width:560px){.stamp{display:none}.search{max-width:none}td.team{max-width:130px;overflow:hidden;text-overflow:ellipsis}}
.search{flex:1 1 220px;max-width:340px;position:relative}
.search input{width:100%;font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);color:var(--ink)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px}
.results{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);max-height:340px;overflow:auto;z-index:20}
.results button{display:flex;width:100%;gap:8px;align-items:center;padding:8px 10px;border:0;background:none;color:var(--ink);font:inherit;font-size:14px;text-align:left;cursor:pointer}
.results button:hover,.results button:focus{background:var(--sunk);outline:none}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs.fr{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent)}
nav.tabs.fl{-webkit-mask-image:linear-gradient(90deg,transparent,#000 40px);mask-image:linear-gradient(90deg,transparent,#000 40px)}
nav.tabs.fl.fr{-webkit-mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent)}
.tab{flex:none;border:0;background:none;color:var(--muted);font:700 15px/1 var(--display);letter-spacing:.04em;text-transform:uppercase;padding:10px 12px 11px;cursor:pointer;border-bottom:3px solid transparent;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c,var(--accent))}
.tab:focus-visible,.subtab:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.dot{width:8px;height:8px;border-radius:2px;background:var(--c);flex:none}
main{padding-block:20px 40px;display:grid;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.1}
h1{font-size:34px;font-weight:800;text-transform:uppercase;font-style:italic}
h2{font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.02em}
h3{font-size:18px;font-weight:700}
.eyebrow{font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.sec{display:grid;gap:12px;min-width:0;align-content:start}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:16px;align-items:start}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
/* feature */
.feature{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:0;padding:0;overflow:hidden;border-top:4px solid var(--c)}
.feature .info{padding:18px;display:grid;gap:14px;align-content:start}
.feature .map{background:var(--sunk);border-left:1px solid var(--line);display:grid;place-items:center;padding:18px;min-height:240px}
@media (max-width:760px){.feature{grid-template-columns:1fr}.feature .map{border-left:0;border-top:1px solid var(--line);min-height:200px}}
.trace{width:100%;max-width:280px;height:auto;aspect-ratio:1}
.trace path{fill:none;stroke:var(--track);stroke-width:4.5;stroke-linejoin:round;stroke-linecap:round}
.trace .sf{fill:var(--c,var(--accent))}
.cd{font:800 38px/1 var(--display);font-variant-numeric:tabular-nums;font-style:italic;white-space:nowrap}
.cd small{font-size:14px;font-weight:600;color:var(--muted);margin-right:6px;font-style:normal}
@media (max-width:560px){.cd{font-size:30px}h1{font-size:28px}}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.kv div{display:grid;gap:2px}
.kv b{font:700 20px/1.1 var(--display)}
.kv span{font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;font:700 12px/1 var(--display);letter-spacing:.05em;text-transform:uppercase;padding:4px 7px 3px;border-radius:3px;background:var(--c);color:#fff;white-space:nowrap}
.sess{font:500 12px var(--mono);padding:2px 6px;border:1px solid var(--line);border-radius:3px;background:var(--sunk);min-width:62px;text-align:center;display:inline-block}
.est{font:600 10px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--amber);background:var(--amber-bg);padding:2px 5px;border-radius:3px;white-space:nowrap}
.sched{display:grid;gap:6px}
.sched div{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:14px}
.sched .t{font:500 14px var(--mono)}
/* title fight */
.callout{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;padding:12px 14px;background:var(--sunk);display:grid;gap:6px}
.callout p{margin:0}
.callout ul{margin:0;padding-left:18px;display:grid;gap:2px}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:minmax(0,130px) 1fr 48px;gap:10px;align-items:center;font-size:13px}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.bar .track{height:10px;background:var(--line);border-radius:2px;position:relative;overflow:hidden}
.bar .fill{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:2px}
.bar .v{font:500 12px var(--mono);text-align:right}
.bar.out{opacity:.45}
/* agenda */
.day{display:grid;gap:6px}
.day>.eyebrow{padding-top:8px;border-top:1px solid var(--line)}
.day:first-child>.eyebrow{border-top:0;padding-top:0}
.row{display:grid;grid-template-columns:52px auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.row .t{font:500 14px var(--mono);font-variant-numeric:tabular-nums}
.row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.past{opacity:.5}
.clash{margin:0;padding:0;display:grid}
.clash li{list-style:none;display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.clash li:first-child{border-top:0;padding-top:0}
.clash .when{font:700 16px var(--display);text-transform:uppercase}
.clash .items{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:13px}
.clash .items span{display:flex;gap:6px;align-items:center}
/* tables */
.tbl{overflow-x:auto;min-width:0}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
tr:last-child td{border-bottom:0}
td.pos{font:700 16px var(--display);width:34px;color:var(--muted)}
tr.p1 td.pos{color:var(--c)}
td.pts{font:600 14px var(--mono);text-align:right}
td.gap{font:500 12px var(--mono);color:var(--muted);text-align:right}
th.r{text-align:right}
td.drv{font-weight:600}
td.team{color:var(--muted)}
.tc{display:inline-block;width:4px;height:14px;border-radius:1px;background:var(--tc,var(--line));margin-right:8px;vertical-align:-2px}
tr.fav td{background:var(--amber-bg)}
tr.hl td{background:var(--amber-bg)}
td.wrap{white-space:normal;min-width:180px}
.res-r{display:grid;gap:2px}
.res-r span{display:flex;gap:6px;align-items:baseline}
.res-r em{font:600 10px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-style:normal;min-width:62px}
.star{border:0;background:none;cursor:pointer;font-size:17px;line-height:1;color:var(--line);padding:2px 4px}
.star[aria-pressed="true"]{color:var(--amber)}
/* series header */
.hero{display:grid;gap:10px;border-top:4px solid var(--c);padding-top:14px}
.facts{display:flex;flex-wrap:wrap;gap:8px 26px;font-size:14px}
.facts div b{display:block;font:700 22px/1.1 var(--display)}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.subtab{border:0;background:none;color:var(--muted);font:600 14px var(--body);padding:8px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.subtab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--c)}
.cal{display:grid}
.ev{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0;padding-top:0}
.ev .rd{font:800 20px/1 var(--display);color:var(--muted);font-style:italic}
.ev.next .rd{color:var(--c)}
.ev .when{font:500 13px var(--mono);color:var(--muted);text-align:right;white-space:nowrap;display:grid;gap:4px;justify-items:end}
.ev .ss{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font-size:13px}
.ev .ss span{display:flex;gap:6px;align-items:center}
.ev .meta{font-size:13px;color:var(--muted);margin-top:2px}
.ev .mini{width:56px;height:56px;margin-top:6px}
.ev .mini path{stroke-width:7}
.evbody{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.badge{font:600 10px var(--body);letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:3px;border:1px solid currentColor}
.news{display:grid}
.news article{padding:12px 0;border-top:1px solid var(--line);display:grid;gap:4px}
.news article:first-child{border-top:0;padding-top:0}
.news a{font-weight:600;text-decoration:none}
.news a:hover{text-decoration:underline}
.news .meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.favs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.fav-card{border:1px solid var(--line);border-left:4px solid var(--c);border-radius:6px;padding:10px 12px;display:grid;gap:2px;background:var(--sunk)}
.fav-card .big{font:800 26px/1 var(--display);font-style:italic}
.empty{border:1px dashed var(--line);border-radius:6px;padding:14px;color:var(--muted);font-size:14px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:13px;font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:5px;padding:6px 10px;background:var(--surface)}
.links a:hover{border-color:var(--c,var(--accent))}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:none;color:var(--muted);font:600 13px var(--body);padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.series-list{display:grid;gap:0}
.series-list article{display:grid;gap:4px;padding:12px 0;border-top:1px solid var(--line)}
.series-list article:first-child{border-top:0;padding-top:0}
footer{border-top:1px solid var(--line);padding-block:16px 28px;font-size:12px;color:var(--muted);display:flex;gap:6px 18px;flex-wrap:wrap}
footer a{color:var(--muted)}
.legal p{margin:0;max-width:68ch}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:default}
.linkbtn{border:0;background:none;padding:0;color:var(--c,var(--accent));font:600 13px var(--body);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.chips-row{display:flex;gap:6px;flex-wrap:wrap}
.trk-pick{display:flex;gap:8px;align-items:center;max-width:460px;min-width:0;width:100%}
.trk-pick select{font:600 14px var(--body);padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);max-width:100%;min-width:0;width:0;flex:1 1 auto}
.trk-pick .btn{width:38px;height:36px;padding:0;font-size:18px;flex:none}
.badge.live{color:var(--accent)}
.pill{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--body);padding:6px 12px;border-radius:999px;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.promo{display:grid;grid-template-columns:1fr 1fr auto;gap:16px;align-items:center;border-left:4px solid var(--accent)}
.promo h3{font-size:18px;margin-top:2px}
@media (max-width:640px){.promo{grid-template-columns:1fr}}
/* circuitos */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px}
.ccard{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:1px solid var(--line);border-top:3px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;padding:12px;cursor:pointer}
.ccard.up{border-top-color:var(--f1)}
.ccard:hover{border-color:var(--ink)}
.ccard .cbody{display:grid;gap:3px;min-width:0}
.ccard .cbody>b{font:700 17px/1.15 var(--display)}
.ccard .muted,.ccard .cw{font-size:12px}
.ctrace{width:76px;height:76px}.ctrace path{stroke-width:7}
.trace.big{max-width:340px}
.ranks{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:14px}
.ranks li{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:4px}
.qimg{width:100%;max-width:220px;justify-self:center;margin:4px auto 0;display:block}
/* quiz */
.qprog{display:flex;gap:4px}
.qprog i{flex:1;height:5px;border-radius:2px;background:var(--line)}
.qprog i.cur{background:var(--muted)}.qprog i.ok{background:var(--ok)}.qprog i.ko{background:var(--accent)}
.qq{font:700 22px/1.25 var(--display);margin:4px 0 0;text-wrap:balance}
.qopts{display:grid;gap:8px}
.qopt{border:1px solid var(--line);background:var(--sunk);color:var(--ink);font:500 15px var(--body);text-align:left;padding:11px 14px;border-radius:6px;cursor:pointer}
.qopt:hover:not(:disabled){border-color:var(--ink)}
.qopt:disabled{cursor:default}
.qopt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--surface))}
.qopt.wrong{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.qfb{font-size:14px;padding:10px 12px;border-radius:6px;background:var(--sunk);border-left:4px solid var(--ok);margin-bottom:10px}
.qfb.ko{border-left-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.qopt.right{animation:pop .28s ease-out}.qopt.wrong{animation:nudge .3s ease-out}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.025)}100%{transform:scale(1)}}
@keyframes nudge{0%,100%{transform:translateX(0)}30%{transform:translateX(-4px)}60%{transform:translateX(3px)}}
.qscore{display:flex;align-items:center;gap:16px}
.qscore b{font:800 56px/1 var(--display);font-style:italic}
.qscore b span{font-size:24px;color:var(--muted)}
.qprog.big{flex:1}.qprog.big i{height:10px}
.qrev{margin:8px 0 0;padding-left:18px;display:grid;gap:8px;font-size:14px}
.okc{color:var(--ok);font-weight:600}.koc{color:var(--accent);font-weight:600}
details summary{cursor:pointer;font-weight:600;font-size:14px}
.sharebox{width:100%;font:13px var(--mono);margin-top:6px;background:var(--sunk);color:var(--ink);border:1px solid var(--line);border-radius:4px}
.pform{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pform .hdr{grid-column:1/-1}
.pfield{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.pfield select{font:500 14px var(--body);text-transform:none;letter-spacing:0;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);color:var(--ink)}
@media (max-width:420px){.pform{grid-template-columns:1fr}}
.prules{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;font-size:14px}
.prules li{display:flex;justify-content:space-between;border-bottom:1px dashed var(--line);padding-bottom:4px}
.legal h2{font-size:18px;margin-top:8px}
.btn{font:600 13px var(--body);padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:var(--sunk);color:var(--ink);cursor:pointer}
/* datos en vivo */
.live-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;flex:none}
.live-dot.ok{background:var(--ok)}
@media (prefers-reduced-motion:no-preference){.live-dot.on{animation:pulse 1.4s ease-in-out infinite}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}60%{box-shadow:0 0 0 6px transparent}}
.stamp{display:flex;align-items:center;gap:6px}
@media (max-width:560px){.stamp:not(.on){display:none}}
.lb{font:700 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
.sp1{font-weight:600;white-space:nowrap}
.spills{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.spills::-webkit-scrollbar{display:none}
.spill{flex:none;display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--sunk);color:var(--ink);font:600 13px var(--body);padding:6px 11px;border-radius:999px;cursor:pointer}
.spill .st{font:500 11px var(--mono);color:var(--muted)}
.spill[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.spill[aria-pressed="true"] .st{color:inherit;opacity:.75}
.livebox{display:grid;gap:8px;border:1px solid var(--line);border-left:4px solid var(--c,var(--accent));border-radius:6px;padding:14px;background:var(--sunk)}
.livebox p{margin:0}
.livebox .big{font:800 30px/1 var(--display);font-style:italic;font-variant-numeric:tabular-nums}
.wx{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:12px;color:var(--muted)}
.wx b{display:block;font:600 15px var(--mono);color:var(--ink)}
.hubgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px;align-items:start}

/* ===== utilidades ===== */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cv = k => `var(${SERIES[k].c})`;
const fmt = (iso,o) => new Intl.DateTimeFormat("es-ES",{timeZone:TZ,...o}).format(new Date(iso));
const hm = iso => fmt(iso,{hour:"2-digit",minute:"2-digit"});
const dayKey = iso => fmt(iso,{year:"numeric",month:"2-digit",day:"2-digit"});
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const dayLabel = iso => cap(fmt(iso,{weekday:"long",day:"numeric",month:"long"}));
const shortDay = iso => cap(fmt(iso,{weekday:"short",day:"numeric"}).replace(".",""));
const dRange = (a,b) => {const f=new Intl.DateTimeFormat("es-ES",{day:"numeric",month:"short",timeZone:"UTC"});const A=new Date(a+"T12:00:00Z"),B=new Date(b+"T12:00:00Z");return A.getUTCMonth()===B.getUTCMonth()?A.getUTCDate()+"–"+f.format(B):f.format(A)+" – "+f.format(B)};
const chip = k => `<span class="chip" style="--c:${cv(k)}">${SERIES[k].short}</span>`;
const ord = n => n+".º";
function trace(id,cls="trace",title){const t=TRACKS[id];if(!t)return"";const m=t.d.match(/^M([\d.]+),([\d.]+)/);return `<svg class="${cls}" viewBox="0 0 200 200" role="img" aria-label="${esc(title||"Trazado del circuito")}"><path d="${t.d}"/>${m?`<circle class="sf" cx="${m[1]}" cy="${m[2]}" r="6"/>`:""}</svg>`}

const saveFavs=()=>{try{localStorage.setItem("parrilla.favs",JSON.stringify(favs))}catch(e){}};
const favId=(k,n)=>k+"|"+n, isFav=(k,n)=>favs.includes(favId(k,n));

function allSessions(){const out=[];for(const k of Object.keys(DATA))for(const ev of DATA[k].events||[])for(const s of ev.s||[])out.push({k,ev,n:s[0],t:s[1],est:!!s[2]});return out.sort((a,b)=>a.t.localeCompare(b.t))}
function upcoming(){const today=new Date().toISOString().slice(0,10);const out=[];for(const k of Object.keys(DATA))for(const ev of DATA[k].events||[])if(!ev.done&&ev.end>=today)out.push({k,ev});return out.sort((a,b)=>a.ev.start.localeCompare(b.ev.start))}
const wkKey=d=>{const x=new Date(d+"T12:00:00Z");x.setUTCDate(x.getUTCDate()-((x.getUTCDay()+6)%7));return x.toISOString().slice(0,10)};

/* ===== lucha por el título (F1) ===== */
function f1Clinch(){
  const D=DATA.f1.drivers, L=D[0], left=DATA.f1.title.racesLeft;
  const after=(left-1)*DATA.f1.title.ptsPerRace;
  const out=[];
  PTS_F1.forEach((lp,p)=>{
    const conds=[];let ok=true;
    for(const r of D.slice(1)){
      const allowed=L[2]+lp-r[2]-after;           // empate resuelto a favor del líder (más victorias)
      if(allowed<0){ok=false;break}
      const best=Math.max(...PTS_F1.filter((_,i)=>i!==p));
      if(allowed>=best) continue;
      const q=PTS_F1.findIndex((v,i)=>i!==p&&v<=allowed);
      conds.push(q<0?`${r[0].split(" ").slice(-1)} no puntúa`:`${r[0].split(" ").slice(-1)} no pasa del ${ord(q+1)} puesto`);
    }
    if(ok) out.push({pos:p+1,conds});
  });
  return out;
}
function contenders(k){
  const d=DATA[k], D=d.drivers, max=d.title.maxLeft ?? d.title.racesLeft*d.title.ptsPerRace;
  return D.filter(r=>d.title.strict? D[0][2]-r[2]<max : D[0][2]-r[2]<=max);
}
function titleBlock(k){
  const d=DATA[k]; if(!d.title) return "";
  const c=cv(k);
  if(k==="f1"){
    const sc=f1Clinch(), nx=d.events.find(e=>!e.done)||{place:"la próxima carrera"}, L=d.drivers[0];
    const max=d.title.racesLeft*d.title.ptsPerRace;
    const cont=contenders("f1"), nm=L[0].split(" ").slice(-1);
    let p;
    if(sc.length){const s=sc[0];p=`<p><b>${esc(L[0])} será campeón en ${esc(nx.place)}</b> si ${s.pos===1?"gana la carrera":"termina "+ord(s.pos)+" o mejor"}${s.conds.length?" y además "+s.conds.map(esc).join(" y "):""}.</p>`}
    else p=`<p>${esc(L[0])} no puede cerrar el título en ${esc(nx.place)}.</p>`;
    return `<div class="callout" style="--c:${c}">${p}<p class="muted" style="font-size:13px">Quedan ${d.title.racesLeft} carreras y ${max} puntos. En caso de empate decide el número de victorias, y ${esc(nm)} tiene ${L[3]}.</p></div>${bars(k,cont,max)}`;
  }
  if(d.title.maxLeft){
    const cont=contenders(k);
    return `<div class="callout" style="--c:${c}"><p>${esc(d.title.text)}</p></div>${bars(k,cont,d.title.maxLeft)}`;
  }
  return `<div class="callout" style="--c:${c}"><p>${esc(d.title.text)}</p></div>`;
}
function champBlock(){const L=DATA.f1.drivers[0];return `<div class="callout champ"><b>🏆 ${esc(L[0])}, campeón del mundo</b><p>${esc(DATA.f1.champion)}</p></div>`}
function bars(k,cont,max){
  const D=DATA[k].drivers, top=D[0][2], show=D.slice(0,Math.max(cont.length+1,4));
  return `<div class="bars" style="--c:${cv(k)}" aria-label="Pilotos con opciones">${show.map(r=>{const alive=cont.includes(r);return `<div class="bar ${alive?"":"out"}"><span class="nm">${esc(r[0])}</span><span class="track"><span class="fill" style="width:${(r[2]/top*100).toFixed(1)}%"></span></span><span class="v">${r[2]===top?r[2]:"−"+(top-r[2])}</span></div>`}).join("")}<span class="muted" style="font-size:12px">${cont.length} pilotos con opciones matemáticas. En gris, los ya descartados.</span></div>`;
}

function favCard(id){

/* pide una URL con caché local; ttl puede depender de lo guardado. Si falla, devuelve lo último guardado (o null) */
async function api(url,ttl,pick){
  const key="api."+url,c=apiMem[key]||store.get(key,null),now=Date.now();
  if(c&&now-c.t<(typeof ttl==="function"?ttl(c.d):ttl)){apiMem[key]=c;LIVE.at=Math.max(LIVE.at,c.t);LIVE.ok=true;return c.d}
  try{
    const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),9000);
    const r=await fetch(url,{signal:ctl.signal,cache:"no-store"});clearTimeout(to);
    if(!r.ok)throw new Error("HTTP "+r.status);
    let d=await r.json();if(pick)d=pick(d);
    const v={t:now,d};apiMem[key]=v;store.set(key,v);LIVE.at=Math.max(LIVE.at,now);LIVE.ok=true;return d;
  }catch(e){if(c){LIVE.at=Math.max(LIVE.at,c.t);LIVE.ok=true}return c?c.d:null}
}

function jolTTL(){const now=Date.now();for(const e of DATA.f1.events)for(const s of e.s||[]){const t=Date.parse(s[1]);if(now>t&&now-t<10*36e5)return 3*6e4}return 30*6e4}
const races=d=>(d&&d.MRData&&d.MRData.RaceTable&&d.MRData.RaceTable.Races)||[];
async function loadJolpica(){
  const ttl=jolTTL(),J=(p,t)=>api(API.jol+SEASON+"/"+p,t);
  const [ds,cs]=await Promise.all([J("driverstandings/?limit=50",ttl),J("constructorstandings/?limit=30",ttl)]);
  const L=ds&&ds.MRData&&ds.MRData.StandingsTable&&ds.MRData.StandingsTable.StandingsLists[0];
  if(!L||!L.DriverStandings||!L.DriverStandings.length)return null;
  const round=+L.round,per=[];
  for(let rd=LIVE_BASE.last+1;rd<=Math.min(round,ROUNDS);rd++){
    const [res,q,sp]=await Promise.all([J(rd+"/results/?limit=50",ttl),J(rd+"/qualifying/?limit=50",ttl),J(rd+"/sprint/?limit=50",ttl)]);
    per.push({rd,res:races(res)[0],q:races(q)[0],sp:races(sp)[0]});
  }
  const C=cs&&cs.MRData&&cs.MRData.StandingsTable&&cs.MRData.StandingsTable.StandingsLists[0];
  return {round,L,C,per};
}
function applyJolpica(j){
  const F=DATA.f1,B=LIVE_BASE;
  F.drivers=B.drivers.map(r=>[...r]);F.teams=B.teams.map(r=>[...r]);F.results.rows=B.rows.map(r=>[...r]);F.status=B.status;F.facts=B.facts;
  F.title={...B.title};delete F.champion;F.events=B.events.map(e=>({...e}));PORRA.result=B.porra;NEWS.splice(0,NEWS.length,...B.news);
  if(j&&j.round>B.last){
    try{
      F.drivers=j.L.DriverStandings.map(s=>[drvName(s.Driver.givenName,s.Driver.familyName),teamName(((s.Constructors||[]).slice(-1)[0]||{}).name),+s.points,+s.wins||0]);
      if(j.C&&j.C.ConstructorStandings)F.teams=j.C.ConstructorStandings.map(s=>[teamName(s.Constructor.name),+s.points]);
      const nm=x=>drvName(x.Driver.givenName,x.Driver.familyName),news=[];
      for(const p of j.per){
        const R=p.res&&p.res.Results;if(!R||!R.length)continue;
        const qp=p.q&&p.q.QualifyingResults&&p.q.QualifyingResults.find(x=>x.position==="1"),g1=R.find(x=>x.grid==="1");
        const pole=qp?nm(qp):g1?nm(g1):"—",spw=p.sp&&p.sp.SprintResults&&p.sp.SprintResults.find(x=>x.position==="1");
        const ev=F.events.find(e=>e.rd===p.rd),win=nm(R[0]),pod=R.slice(0,3).map(nm);
        F.results.rows.push([p.rd,SHORT[p.rd]||p.res.raceName,ev?ev.place:"",shortDate(p.res.date),[pole],[win,teamName(R[0].Constructor&&R[0].Constructor.name)],spw?nm(spw):null,"Podio: "+pod.map(surname).join(", ")]);
        if(ev){ev.done=true;ev.res="Ganador: "+win}
        if(PORRA.id===`f1-${SEASON}-${p.rd}`&&pod.length===3)PORRA.result={pole,p1:win,podium:pod};
        news.unshift({cat:"f1",d:shortDate(p.res.date),t:`${win} gana el ${GPNAME[p.rd]||p.res.raceName}`,s:`Podio: ${pod.join(", ")}. La pole fue para ${pole}.`,u:`https://www.formula1.com/en/results/${SEASON}/races`,src:"Parrilla · resultados en vivo"});
      }
      const D=F.drivers,L=D[0],S=D[1],left=Math.max(0,ROUNDS-j.round);
      F.status=`Tras el ${GPNAME[j.round]||"GP"} · Ronda ${j.round} de ${ROUNDS}`;
      F.title={ptsPerRace:LIVE_RACE_PTS,racesLeft:left};
      F.facts=[[String(L[2]),surname(L[0])+", líder"],["+"+(L[2]-S[2]),"sobre "+surname(S[0])],[String(left),"carreras restantes"],[String(left*LIVE_RACE_PTS),"puntos en juego"]];
      if(contenders("f1").length===1){
        F.champion=`${L[0]} (${L[1]}) es campeón del mundo de Fórmula 1 de ${SEASON}${left?` a falta de ${left} ${left===1?"carrera":"carreras"}`:""}, con ${L[2]} puntos y ${L[3]} victorias.`;
        F.facts=[[surname(L[0]),"campeón del mundo"],[String(L[2]),"puntos"],["+"+(L[2]-S[2]),"sobre "+surname(S[0])],[String(left),"carreras restantes"]];
        delete F.title;
        news.unshift({cat:"f1",d:news.length?news[0].d:shortDate(new Date().toISOString().slice(0,10)),t:`${L[0]}, campeón del mundo de F1 ${SEASON}`,s:`Se asegura el título con ${L[2]} puntos, ${L[2]-S[2]} más que ${S[0]}.`,u:`https://www.formula1.com/en/results/${SEASON}/drivers`,src:"Parrilla · resultados en vivo"});
      }
      NEWS.unshift(...news);
    }catch(e){applyJolpica(null);return}
  }
  LAST_DONE=Math.max(0,...F.results.rows.map(r=>r[0]));
}

/* ---- OpenF1: el fin de semana en curso (o el último) ---- */
const SNAME={"Practice 1":"Libres 1","Practice 2":"Libres 2","Practice 3":"Libres 3","Qualifying":"Clasificación","Sprint Qualifying":"Clasif. sprint","Sprint Shootout":"Clasif. sprint","Sprint":"Sprint","Race":"Carrera"};
const sName=s=>SNAME[s.session_name]||s.session_name;
const sState=s=>{const n=Date.now();return n<Date.parse(s.date_start)?"next":n<=Date.parse(s.date_end)?"live":"done"};
async function loadMeeting(){
  const ss=await api(API.of1+"sessions?year="+SEASON,6*36e5,d=>Array.isArray(d)?d.map(s=>({session_key:s.session_key,meeting_key:s.meeting_key,session_name:s.session_name,session_type:s.session_type,date_start:s.date_start,date_end:s.date_end,location:s.location,is_cancelled:s.is_cancelled})):d);
  if(!Array.isArray(ss))return null;
  const by={};ss.filter(s=>!s.is_cancelled&&s.date_start&&s.date_end).forEach(s=>(by[s.meeting_key]||=[]).push(s));
  const ms=Object.values(by).filter(l=>l.some(s=>s.session_type==="Race")).map(l=>l.sort((a,b)=>a.date_start.localeCompare(b.date_start)));
  ms.sort((a,b)=>a[0].date_start.localeCompare(b[0].date_start));
  return ms.filter(l=>Date.parse(l[0].date_start)<=Date.now()+2*864e5).slice(-1)[0]||null;
}
const meetingEvent=m=>{const a=m[0].date_start.slice(0,10),b=m[m.length-1].date_start.slice(0,10);return DATA.f1.events.find(e=>e.start<=b&&e.end>=a)};
const weekendOn=()=>{const m=LIVE.meeting;if(!m)return false;const n=Date.now();return n>=Date.parse(m[0].date_start)-36*36e5&&n<=Date.parse(m[m.length-1].date_end)+48*36e5};
const RC_SC=[[/VIRTUAL SAFETY CAR DEPLOYED/,"Coche de seguridad virtual"],[/VIRTUAL SAFETY CAR ENDING/,"Fin del coche de seguridad virtual"],[/SAFETY CAR DEPLOYED/,"Coche de seguridad en pista"],[/SAFETY CAR IN THIS LAP/,"El coche de seguridad se retira en esta vuelta"]];
function pickRC(d){
  if(!Array.isArray(d))return d;
  return d.filter(x=>x.category==="SafetyCar"||x.flag==="RED"||x.flag==="CHEQUERED"||/PENALTY|DISQUALIFIED/.test(x.message||"")).slice(-12).map(x=>({l:x.lap_number,c:x.category,f:x.flag,m:x.message}));
}
async function loadSession(s,full){
  const k=s.session_key,ended=Date.parse(s.date_end),recent=Date.now()-ended<8*36e5;
  const T=d=>Array.isArray(d)&&d.length?(recent?3*6e4:864e5):(recent?6e4:36e5),O=(p,pick)=>api(API.of1+p+"?session_key="+k,T,pick);
  const race=s.session_type==="Race";
  const [res,drv,stints,pits,rc,w]=await Promise.all([
    O("session_result",d=>Array.isArray(d)?d.map(r=>({p:r.position,n:r.driver_number,laps:r.number_of_laps,dur:r.duration,gap:r.gap_to_leader,pts:r.points,dnf:r.dnf,dns:r.dns,dsq:r.dsq})):d),
    O("drivers",d=>Array.isArray(d)?d.map(x=>({n:x.driver_number,a:x.name_acronym,f:x.first_name,l:x.last_name,t:x.team_name,c:x.team_colour})):d),
    full&&race?O("stints",d=>Array.isArray(d)?d.map(x=>({n:x.driver_number,a:x.lap_start,b:x.lap_end,c:x.compound})):d):null,
    full&&race?O("pit",d=>Array.isArray(d)?d.map(x=>({n:x.driver_number,l:x.lap_number,st:x.stop_duration,ln:x.lane_duration??x.pit_duration})):d):null,
    full?O("race_control",pickRC):null,
    full?O("weather",d=>Array.isArray(d)&&d.length?[d[d.length-1]]:d):null,
  ]);
  return {state:res==null?"off":res.length?"done":"wait",full,res,drv,stints,pits,rc,w:w&&w[0]};
}
function hubPick(){
  const m=LIVE.meeting;if(!m)return null;
  return (LIVE.sel&&m.find(x=>x.session_key===LIVE.sel))||m.find(s=>sState(s)==="live")||[...m].reverse().find(s=>sState(s)==="done")||m[0];
}
/* quién fue primero en una sesión de F1 de la agenda local (por hora de inicio) */
function sessP1(iso){
  const m=LIVE.meeting;if(!m)return "";
  const s=m.find(x=>Math.abs(Date.parse(x.date_start)-Date.parse(iso))<3*36e5&&sState(x)==="done"),D=s&&LIVE.sess[s.session_key];
  if(!D||!D.res||!D.res.length)return "";
  const r=D.res.find(x=>x.p===1),d=r&&(D.drv||[]).find(x=>x.n===r.n);

const liveNow=(iso,n)=>{const t=Date.parse(iso),now=Date.now();return now>=t&&now<t+(/Carrera|Principal|Race/.test(n)?2.2:1.1)*36e5};
const liveBadge='<span class="lb"><span class="live-dot on"></span>En directo</span>';

/* ---- formato de tiempos ---- */
const lapT=s=>{if(typeof s!=="number")return "—";const m=Math.floor(s/60),r=(s-m*60).toFixed(3).padStart(6,"0");return m?`${m}:${r}`:r};
const raceT=s=>{if(typeof s!=="number")return "—";const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=(s%60).toFixed(3).padStart(6,"0");return `${h}:${String(m).padStart(2,"0")}:${r}`};
const gapT=g=>typeof g==="number"?"+"+g.toFixed(3):typeof g==="string"?g.replace(/^\+?(\d+)\s*LAPS?$/i,(_,n)=>`+${n} ${n==="1"?"vuelta":"vueltas"}`):"—";
const dec=(x,d=1)=>Number(x).toLocaleString("es-ES",{maximumFractionDigits:d,minimumFractionDigits:d});
function ago(t){const s=Math.max(0,Math.round((Date.now()-t)/1e3));return s<60?"hace un momento":s<3600?`hace ${Math.round(s/60)} min`:s<86400?`hace ${Math.round(s/3600)} h`:`hace ${Math.round(s/86400)} d`}

/* ---- panel del fin de semana ---- */
function hubMount(){const el=$("#hub-slot");if(!el)return;el.innerHTML=hubHTML(el.dataset.full==="1");
  const c=el.querySelector(".spills"),p=c&&c.querySelector('[aria-pressed="true"]');if(p)c.scrollLeft=p.offsetLeft-c.offsetLeft-(c.clientWidth-p.offsetWidth)/2}
function hubHTML(full){
  const m=LIVE.meeting;
  if(!m)return full?`<section class="panel sec"><h2>Fin de semana</h2><div class="empty">${LIVE.tried?"No se ha podido conectar con el servicio de datos de F1. Se vuelve a intentar cada minuto; mientras tanto tienes los resultados guardados en la pestaña Resultados.":"Cargando los datos del fin de semana…"}</div></section>`:"";
  if(!full&&!weekendOn())return "";
  const ev=meetingEvent(m),s=hubPick(),D=LIVE.sess[s.session_key];
  const pills=m.map(x=>{const t=sState(x);return `<button class="spill" aria-pressed="${x===s}" data-sess="${x.session_key}">${t==="live"?'<span class="live-dot on"></span>':""}${esc(sName(x))}<span class="st">${t==="next"?esc(shortDay(x.date_start))+" "+hm(x.date_start):t==="live"?"en directo":"✓"}</span></button>`}).join("");
  return `<section class="panel sec" style="--c:var(--f1)">
    <div class="hdr"><div class="sec" style="gap:2px"><span class="eyebrow">Fin de semana de F1${ev?" · Ronda "+ev.rd:""}</span><h2>${esc(ev?ev.name:"GP de "+(m[0].location||""))}</h2></div><span class="muted mono" style="font-size:12px">${LIVE.at?`Datos: <span data-ago="${LIVE.at}">${ago(LIVE.at)}</span>`:""}</span></div>
    <div class="spills" role="group" aria-label="Sesiones del fin de semana">${pills}</div>
    ${sessBody(s,D)}</section>`;
}
function sessBody(s,D){
  const st=sState(s),nm=esc(sName(s));
  if(st==="next")return `<div class="livebox" style="--c:var(--line)"><span class="eyebrow">${nm} · ${esc(dayLabel(s.date_start))} a las ${hm(s.date_start)}</span><div class="big" data-cd="${s.date_start}"></div><p class="muted" style="font-size:14px">La clasificación de la sesión aparecerá aquí unos minutos después de que termine.</p></div>`;
  if(st==="live")return `<div class="livebox"><span class="lb"><span class="live-dot on"></span>En directo · ${nm}</span><p><b>La sesión está en marcha.</b> Termina hacia las ${hm(s.date_end)}. En cuanto acabe, la clasificación, los neumáticos y las paradas aparecerán aquí solos, sin recargar.</p><p class="muted" style="font-size:13px">Los tiempos vuelta a vuelta en directo solo se publican en el live timing oficial de F1.</p><div class="links"><a href="https://www.formula1.com/en/timing/f1-live" target="_blank" rel="noopener">Live timing oficial ↗</a></div></div>`;
  if(!D)return `<div class="empty">Cargando ${nm}…</div>`;
  if(D.state==="off")return `<div class="empty">No se ha podido conectar con el servicio de datos de F1. Se vuelve a intentar cada minuto.</div>`;
  if(D.state==="wait")return `<div class="livebox" style="--c:var(--amber)"><span class="eyebrow">${nm} · terminada</span><p>Esperando la clasificación oficial. Se comprueba cada minuto y aparecerá aquí sola.</p></div>`;
  const race=s.session_type==="Race";
  return `${wxHTML(D.w)}<div class="hubgrid"><div class="sec">${resTable(s,D)}</div>${race||(D.rc&&D.rc.length)?`<div class="sec" style="gap:18px">${race?tyreHTML(D):""}${race?pitHTML(D):""}${rcHTML(D.rc)}</div>`:""}</div>`;
}
const drvMap=D=>Object.fromEntries((D.drv||[]).map(d=>[d.n,d]));
const dColor=d=>d&&/^[0-9a-f]{6}$/i.test(d.c||"")?"#"+d.c:(d&&TEAMC[teamName(d.t)])||"var(--line)";
function resTable(s,D){
  const dm=drvMap(D),q=s.session_type==="Qualifying",race=s.session_type==="Race",pts=race&&D.res.some(r=>r.pts);
  const rows=[...D.res].sort((a,b)=>(a.p??99)-(b.p??99));
  const body=rows.map((r,i)=>{
    const d=dm[r.n]||{},name=d.l?drvName(d.f,d.l):"#"+r.n;let tm,ph="";
    if(q){const k=[2,1,0].find(j=>Array.isArray(r.dur)&&typeof r.dur[j]==="number");tm=k==null?(r.dns?"No salió":r.dsq?"Descalificado":"Sin tiempo"):lapT(r.dur[k]);ph=k==null?"":"Q"+(k+1)}
    else if(r.dsq)tm="Descalificado";else if(r.dns)tm="No salió";else if(r.dnf)tm="Abandono";
    else tm=r.p===1?(race?raceT(r.dur):lapT(r.dur)):gapT(r.gap);
    const fav=isFav("f1",name);
    return `<tr class="${r.p===1?"p1":""} ${fav?"fav":""}"><td class="pos">${r.p??"—"}</td><td class="drv"><span class="tc" style="--tc:${dColor(d)}"></span>${esc(name)}<small>${esc(teamName(d.t))}</small></td>${q?`<td class="ph">${ph}</td>`:""}<td class="tm">${esc(tm)}</td>${race?(pts?`<td class="pts">${r.pts?dec(r.pts,0):""}</td>`:""):`<td class="tm">${r.laps??""}</td>`}</tr>`}).join("");
  const head=`<th>Pos</th><th>Piloto</th>${q?"<th>Fase</th>":""}<th class="r">${q?"Mejor vuelta":race?"Tiempo":"Mejor vuelta"}</th>${race?(pts?'<th class="r">Pts</th>':""):'<th class="r">Vueltas</th>'}`;
  return `<h3>Clasificación · ${esc(sName(s))}</h3><div class="tbl"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function wxHTML(w){
  if(!w)return "";
  const it=[["Aire",w.air_temperature!=null?dec(w.air_temperature)+" °C":null],["Pista",w.track_temperature!=null?dec(w.track_temperature)+" °C":null],["Humedad",w.humidity!=null?Math.round(w.humidity)+" %":null],["Viento",w.wind_speed!=null?dec(w.wind_speed*3.6,0)+" km/h":null],["Lluvia",w.rainfall!=null?(w.rainfall?"Sí":"No"):null]].filter(x=>x[1]);
  return it.length?`<div class="wx" aria-label="Tiempo al final de la sesión">${it.map(x=>`<span><b>${x[1]}</b>${x[0]}</span>`).join("")}</div>`:"";

const CMP={SOFT:["S","Blando"],MEDIUM:["M","Medio"],HARD:["H","Duro"],INTERMEDIATE:["I","Intermedio"],WET:["W","Lluvia"]};
function tyreHTML(D){
  if(!Array.isArray(D.stints)||!D.stints.length)return "";

  const max=Math.max(...D.stints.map(x=>x.b||0));if(!max)return "";

      return `<span class="sg ${cl}" style="left:${((x.a-1)/max*100).toFixed(2)}%;width:${w.toFixed(2)}%" title="${esc(c[1])}: vueltas ${x.a}–${x.b}">${w>7?c[0]:""}</span>`}).join("");
    const txt=L.map(x=>`${(CMP[x.c]||["","desconocido"])[1].toLowerCase()} (${x.a}–${x.b})`).join(", ");
    return `<div class="ty" role="img" aria-label="${esc((d.l?drvName(d.f,d.l):label)+": "+txt)}"><span>${esc(label)}</span><span class="lane">${segs}</span><span class="np" title="Paradas">${L.length-1}</span></div>`}).join("");
  return `<div class="sec" style="gap:8px"><div class="hdr"><h3>Estrategia de neumáticos</h3><span class="muted" style="font-size:12px">${max} vueltas · paradas a la derecha</span></div><div class="tyres">${rows}</div>
  <div class="legend">${Object.entries(CMP).filter(([k])=>used.has(k)).map(([,v])=>`<span><span class="cmp cmp-${v[0]}"></span>${v[1]}</span>`).join("")}</div></div>`;
}
function pitHTML(D){
  if(!Array.isArray(D.pits)||!D.pits.length)return "";

  return `<div class="sec" style="gap:6px"><h3>Paradas</h3><p style="margin:0;font-size:14px">${D.pits.length} paradas en total.${best?" La más rápida: "+best+".":""}</p></div>`;

function rcHTML(rc){
  if(!Array.isArray(rc)||!rc.length)return "";

    if(x.c==="SafetyCar"){tag=/VIRTUAL/.test(m)?"VSC":"Safety car";cls="sc";const t=RC_SC.find(r=>r[0].test(m));if(t)txt=t[1]}

  return `<div class="sec" style="gap:8px"><h3>Dirección de carrera</h3><ul class="rc">${[...rc].reverse().map(item).join("")}</ul><span class="muted" style="font-size:12px">Banderas, coches de seguridad y sanciones. Los mensajes oficiales están en inglés.</span></div>`;
}

/* ---- ciclo de actualización: cada minuto y al volver a la pestaña ---- */
function liveSig(){const F=DATA.f1,m=LIVE.meeting;return JSON.stringify([F.drivers,F.results.rows.length,PORRA.result,!!F.champion,m&&m.map(s=>[s.session_key,sState(s),(LIVE.sess[s.session_key]||{}).state])])}
async function liveTick(){
  if(LIVE.busy)return;LIVE.busy=true;
  try{
    applyJolpica(await loadJolpica());
    LIVE.meeting=await loadMeeting();
    const m=LIVE.meeting;
    if(m){
      const pick=hubPick();
      for(const s of m){if(sState(s)!=="done")continue;const full=s===pick;const prev=LIVE.sess[s.session_key];
        if(full||!prev||!prev.full)LIVE.sess[s.session_key]=await loadSession(s,full)||prev}
    }
  }catch(e){}
  LIVE.tried=true;LIVE.busy=false;stampUpdate();
  const sig=liveSig();
  if(sig!==LIVE.sig){LIVE.sig=sig;liveRender()}
}
/* vuelve a pintar la vista actual sin mover el scroll, salvo si el usuario está escribiendo o eligiendo algo */
function liveRender(){
  const a=document.activeElement;if(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName))return hubMount();
  if(current==="home"||current==="f1"||current==="circuitos")go(decodeURIComponent(location.hash.slice(1))||"home",true,true);
  else hubMount();
}
async function hubSelect(k){
  LIVE.sel=k;hubMount();const s=hubPick();
  if(s&&sState(s)==="done"&&!(LIVE.sess[k]&&LIVE.sess[k].full)){LIVE.sess[k]=await loadSession(s,true);LIVE.sig=liveSig();hubMount()}
}
function stampUpdate(){
  const el=$("#stamp");if(!el)return;
  el.classList.toggle("on",!!(LIVE.ok&&LIVE.at));
  el.innerHTML=LIVE.ok&&LIVE.at?`<span class="live-dot ok"></span>F1 en vivo · <span data-ago="${LIVE.at}">${ago(LIVE.at)}</span>`:"Actualizado: "+esc(UPDATED);
}
function liveClocks(){
  document.querySelectorAll("[data-ago]").forEach(el=>{el.textContent=ago(+el.dataset.ago)});
  document.querySelectorAll("[data-cd]").forEach(el=>{const ms=Date.parse(el.dataset.cd)-Date.now();if(ms<=0){el.textContent="Empezando…";if(!LIVE.busy&&ms>-9e4)liveTick();return}
    const d=Math.floor(ms/864e5),h=Math.floor(ms%864e5/36e5),mi=Math.floor(ms%36e5/6e4),se=Math.floor(ms%6e4/1e3);el.textContent=`${d?d+"d ":""}${String(h).padStart(2,"0")}:${String(mi).padStart(2,"0")}:${String(se).padStart(2,"0")}`});
}
setInterval(liveClocks,1000);
setInterval(()=>{if(!document.hidden)liveTick()},60e3);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)liveTick()});

/* ===== interacción ===== */
document.addEventListener("click",e=>{
  const cb=e.target.closest("[data-circ]");if(cb){go("circuitos/"+cb.dataset.circ);return}
  const gt=e.target.closest("[data-goto]");if(gt){go(gt.dataset.goto);return}
  const sp=e.target.closest("[data-sess]");if(sp){hubSelect(+sp.dataset.sess);return}
  const qa=e.target.closest("[data-qa]");if(qa){quizAnswer(+qa.dataset.qa);return}
  if(e.target.closest("#qnext")){quizNext();return}
  const st=e.target.closest(".star[data-fav]");
  if(st){const id=st.dataset.fav;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];saveFavs();go(current,true);return}
  const sv=e.target.closest(".seg button[data-v]");if(sv){teamView=sv.dataset.v==="t";renderSeries(current);return}
  const stb=e.target.closest(".subtab");if(stb){sub=stb.dataset.sub;renderSeries(current);return}
  const r=e.target.closest(".results button");
  if(r){$("#qres").hidden=true;$("#q").value="";sub="clas";teamView=!!r.dataset.team;go(r.dataset.k);requestAnimationFrame(()=>{const row=[...document.querySelectorAll("tr[data-n]")].find(tr=>tr.dataset.n===r.dataset.n);if(row){row.classList.add("hl");row.scrollIntoView({block:"center"})}});return}
  if(!e.target.closest(".search"))$("#qres").hidden=true;
});
const norm=s=>String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
$("#q").addEventListener("input",e=>{
  const q=norm(e.target.value.trim()),box=$("#qres");
  if(q.length<2){box.hidden=true;return}
  const hits=[];for(const k of Object.keys(DATA))(DATA[k].drivers||[]).forEach((r,i)=>{if(norm(r[0]).includes(q)||norm(r[1]).includes(q))hits.push({k,r,i})});
  box.innerHTML=hits.length?hits.slice(0,14).map(h=>`<button data-k="${h.k}" data-n="${esc(h.r[0])}">${chip(h.k)}<span style="flex:1;min-width:0"><b>${esc(h.r[0])}</b> <span class="muted">${esc(h.r[1])}</span></span><span class="mono" style="font-size:12px">P${h.i+1} · ${h.r[2]} pts</span></button>`).join(""):`<div style="padding:10px;font-size:14px" class="muted">No hay ningún piloto con ese nombre en las categorías disponibles.</div>`;
  box.hidden=false;
});
$("#q").addEventListener("keydown",e=>{if(e.key==="Escape"){$("#qres").hidden=true;e.target.blur()}});
$("#stamp").textContent="Actualizado: "+UPDATED;
$("#foot").innerHTML=`<span>Parrilla es un proyecto independiente, sin relación con Formula 1, la FIA ni los organizadores de los campeonatos.</span><span>Datos actualizados el ${UPDATED}; los de F1 se completan solos con OpenF1 y Jolpica. Horarios en ${TZ_LABEL}. «Estimada»: hora prevista, pendiente de confirmación oficial.</span><a href="#legal" id="legal-link">Aviso legal y privacidad</a>`;
$("#foot").addEventListener("click",e=>{if(e.target.id==="legal-link"){e.preventDefault();go("legal")}});
let start="home";try{start=decodeURIComponent(location.hash.slice(1))||"home"}catch(e){}
go(start,false,true);
window.addEventListener("popstate",()=>{sub="clas";teamView=false;go(decodeURIComponent(location.hash.slice(1))||"home",false,true)});
LIVE.sig=liveSig();liveTick();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>

</body></html>
